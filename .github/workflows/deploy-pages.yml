name: Deploy DevizPRO V2 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract verified site archive
        run: |
          set -euo pipefail
          archive="DevizPRO_v2_site_upload.zip"
          test -f "$archive"
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q "$archive" -d extracted
          if [ -f extracted/index.html ]; then
            cp -a extracted/. _site/
          elif [ -f extracted/devizpro_v2_build/index.html ]; then
            cp -a extracted/devizpro_v2_build/. _site/
          else
            echo "Archive does not contain a deployable index.html"
            exit 1
          fi
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/manifest.webmanifest
          test -s _site/service-worker.js
          test -s _site/assets/js/devizpro-shell.js
          echo "Verified site files:"
          find _site -type f | sort

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
