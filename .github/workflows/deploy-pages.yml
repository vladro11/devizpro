
name: Deploy DevizPRO V2 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract DevizPRO V2 archive
        run: |
          set -e
          mkdir extracted
          mkdir _site

          zip_file=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$zip_file" ]; then
            echo "Nu a fost găsită arhiva ZIP."
            exit 1
          fi

          unzip -q "$zip_file" -d extracted

          if [ -f extracted/devizpro_v2_build/index.html ]; then
            cp -a extracted/devizpro_v2_build/. _site/
          elif [ -f extracted/index.html ]; then
            cp -a extracted/. _site/
          else
            echo "Nu am găsit index.html în arhivă."
            find extracted -name index.html
            exit 1
          fi

          touch _site/.nojekyll
          test -f _site/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
